[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Translate natural language prompts into structured function calls using constrained decoding on a small local LLM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.3.0",
    "mypy>=1.20.1",
    "numpy>=2.2.6",
    "pydantic>=2.13.2",
    "torch>=2.11.0",
    "transformers>=5.7.0",
]

[tool.uv]
package = false
